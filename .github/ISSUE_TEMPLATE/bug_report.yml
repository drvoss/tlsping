name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Redact credentials, private URLs, IP addresses, and certificate details.
  - type: input
    id: platform
    attributes:
      label: OS and architecture
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and redacted output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
